id = "dengliu.kubernetes"
name = "Kubernetes"
version = "0.3.7"
icon = "icons/kubernetes-logo.svg"
description = "Manage Kubernetes clusters, Helm releases and Kustomize overlays: cluster explorer with live Pod logs, shell and port-forward, YAML completion, cross-resource navigation, gutter markers and manifest inspections."
authors = ["Deng Liu"]
homepage = "https://github.com/dengliu/openidea-kubernetes"
license = "Apache-2.0"
change-notes = "0.3.7 — add IntelliJ-style Kubernetes, Helm (chart directories, Chart.yaml, values.yaml, templates), and Kustomize (overlay/component directories, kustomization.yaml, patches/plugins) file and folder icons with automatic project structure and YAML content detection."
categories = ["tools", "frameworks"]
engines.openidea = "^1.8"
wasm = "dist/plugin.wasm"
activation = [
    "on-startup-finished",
    "on-view:kubernetes",
    "on-language:yaml",
    "on-event:file-opened",
    "on-event:file-saved",
    "on-event:files-changed",
    "on-command:*",
]

[capabilities]
required = [
    "project.read",
    "editor.read",
    "editor.write",
    "events",
    "storage",
    "clipboard",
    "net:127.0.0.1",
    "process:kubectl",
]
optional = ["process:helm", "process:kustomize"]

[[contributes.views]]
id = "kubernetes"
title = "Kubernetes"
icon = "icons/kubernetes.svg"
location = "right"
secondary = true
web = "web/index.html"
header = "none"

[[contributes.statusBar]]
id = "context"
text = "k8s"
tooltip = "Kubernetes context and namespace (click to switch context)"
command = "switch-context"
align = "right"
priority = 120

[[contributes.providers]]
kinds = ["completion", "code-actions", "definition", "line-markers"]
languages = ["yaml"]

[[contributes.commands]]
id = "refresh"
title = "Kubernetes: Refresh Cluster State"
category = "Kubernetes"

[[contributes.commands]]
id = "switch-context"
title = "Kubernetes: Switch Context"
category = "Kubernetes"

[[contributes.commands]]
id = "switch-namespace"
title = "Kubernetes: Switch Namespace"
category = "Kubernetes"

[[contributes.commands]]
id = "apply"
title = "Kubernetes: Apply Current Manifest"
category = "Kubernetes"
when = "editorLang == yaml"

[[contributes.commands]]
id = "diff"
title = "Kubernetes: Diff Current Manifest with Cluster"
category = "Kubernetes"
when = "editorLang == yaml"

[[contributes.commands]]
id = "delete-manifest"
title = "Kubernetes: Delete Resources in Current Manifest"
category = "Kubernetes"
when = "editorLang == yaml"

[[contributes.commands]]
id = "dry-run"
title = "Kubernetes: Validate Current Manifest (Dry Run)"
category = "Kubernetes"
when = "editorLang == yaml"

[[contributes.commands]]
id = "inspect"
title = "Kubernetes: Inspect Current File"
category = "Kubernetes"
when = "editorLang == yaml"

[[contributes.commands]]
id = "scan-project"
title = "Kubernetes: Inspect All Project Manifests"
category = "Kubernetes"

[[contributes.commands]]
id = "follow-logs"
title = "Kubernetes: Follow Pod Logs in Terminal"
category = "Kubernetes"

[[contributes.commands]]
id = "exec-shell"
title = "Kubernetes: Open Shell in Pod Container"
category = "Kubernetes"

[[contributes.commands]]
id = "port-forward"
title = "Kubernetes: Port Forward to Resource"
category = "Kubernetes"

[[contributes.commands]]
id = "scale"
title = "Kubernetes: Scale Workload Replicas"
category = "Kubernetes"

[[contributes.commands]]
id = "rollout-restart"
title = "Kubernetes: Rollout Restart Workload"
category = "Kubernetes"

[[contributes.commands]]
id = "helm-template"
title = "Kubernetes: Render Helm Chart Templates"
category = "Kubernetes"

[[contributes.commands]]
id = "kustomize-build"
title = "Kubernetes: Build Kustomize Overlay"
category = "Kubernetes"

[[contributes.menus]]
menu = "editor.context"
command = "apply"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editor.context"
command = "diff"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editor.context"
command = "dry-run"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editor.context"
command = "delete-manifest"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editor.context"
command = "inspect"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editorTab.context"
command = "apply"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "editorTab.context"
command = "diff"
when = "editorLang == yaml"

[[contributes.menus]]
menu = "projectView.context"
command = "scan-project"

[[contributes.menus]]
menu = "projectView.context"
command = "kustomize-build"

[[contributes.menus]]
menu = "projectView.context"
command = "helm-template"

[[contributes.menus]]
menu = "tools"
command = "refresh"

[[contributes.menus]]
menu = "tools"
command = "switch-context"

[[contributes.menus]]
menu = "tools"
command = "switch-namespace"

[[contributes.menus]]
menu = "tools"
command = "scan-project"

[[contributes.menus]]
menu = "tools"
command = "kustomize-build"

[[contributes.menus]]
menu = "tools"
command = "helm-template"

[[contributes.runDetectors]]
id = "kustomize-build"
name = "kubectl kustomize"
files = ["kustomization.yaml", "kustomization.yml"]
command = "kubectl"
args = ["kustomize", "."]

[[contributes.runDetectors]]
id = "helm-lint"
name = "helm lint"
files = ["Chart.yaml"]
command = "helm"
args = ["lint", "."]
test = true

[[contributes.runDetectors]]
id = "helm-template"
name = "helm template"
files = ["Chart.yaml"]
command = "helm"
args = ["template", "."]

[[contributes.fileIcons]]
id = "kubernetes"
patterns = ["*.k8s.yaml", "*.k8s.yml", "kubeconfig", "*.kubeconfig"]
icon = "icons/k8s-manifest.svg"
iconDark = "icons/k8s-manifest_dark.svg"

[[contributes.fileIcons]]
id = "helm-chart-dir"
icon = "icons/helm-chart-dir.svg"
iconDark = "icons/helm-chart-dir_dark.svg"

[[contributes.fileIcons]]
id = "helm-chart"
patterns = ["Chart.yaml", "Chart.yml", "Chart.lock", "requirements.lock", "helmfile.yaml", "helmfile.yml", "*.helmfile.yaml", "*.helmfile.yml"]
icon = "icons/helm-chart.svg"
iconDark = "icons/helm-chart_dark.svg"

[[contributes.fileIcons]]
id = "helm-values"
patterns = ["values.yaml", "values.yml", "values.*.yaml", "values.*.yml", "values-*.yaml", "values-*.yml", "*.values.yaml", "*.values.yml", "values.schema.json"]
icon = "icons/helm-values.svg"
iconDark = "icons/helm-values_dark.svg"

[[contributes.fileIcons]]
id = "helm-template"
patterns = ["*.tpl", "*.helm.yaml", "*.helm.yml", ".helmignore"]
icon = "icons/helm-template.svg"
iconDark = "icons/helm-template_dark.svg"

[[contributes.fileIcons]]
id = "kustomize-dir"
icon = "icons/kustomize-dir.svg"
iconDark = "icons/kustomize-dir_dark.svg"

[[contributes.fileIcons]]
id = "kustomize"
patterns = ["kustomization.yaml", "kustomization.yml", "Kustomization"]
icon = "icons/kustomize.svg"
iconDark = "icons/kustomize_dark.svg"

[[contributes.fileIcons]]
id = "kustomize-patch"
patterns = ["*.kustomize.yaml", "*.kustomize.yml"]
icon = "icons/kustomize-patch.svg"
iconDark = "icons/kustomize-patch_dark.svg"

[[contributes.fileTemplates]]
id = "deployment"
name = "Kubernetes Deployment"
extension = "yaml"
path = "templates/deployment.yaml"

[[contributes.fileTemplates]]
id = "service"
name = "Kubernetes Service"
extension = "yaml"
path = "templates/service.yaml"

[[contributes.fileTemplates]]
id = "configmap"
name = "Kubernetes ConfigMap"
extension = "yaml"
path = "templates/configmap.yaml"

[[contributes.fileTemplates]]
id = "ingress"
name = "Kubernetes Ingress"
extension = "yaml"
path = "templates/ingress.yaml"

[[contributes.fileTemplates]]
id = "kustomization"
name = "Kustomization"
extension = "yaml"
path = "templates/kustomization.yaml"

[contributes.settings]
title = "Kubernetes"
schema = "settings.schema.json"
